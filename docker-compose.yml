name: tea-quantiles
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-tea-quantiles}-db
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-demo-db-2026}
    ports: ["${DB_PORT:-17740}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 3s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-tea-quantiles}-redis
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-tea-quantiles}-backend
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://research:${DB_PASSWORD:-local-demo-db-2026}@db:5432/research
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-demo-tea-quantiles-replace-for-production}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports: ["${BACKEND_PORT:-19240}:8000"]
    volumes: ["run-artifacts:/app/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 4s
      retries: 40
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-tea-quantiles}-worker
    command: python -m src.worker
    environment: *app-env
    volumes: ["run-artifacts:/app/artifacts"]
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/worker-heartbeat').st_mtime<15"]
      interval: 3s
      timeout: 4s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-tea-quantiles}-frontend
    ports: ["${FRONTEND_PORT:-18240}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 4s
      retries: 20
volumes:
  db-data:
  redis-data:
  run-artifacts:
